process watchdog {
    run /usr/bin/python3 /opt/exabgp/exabgp_api.py;
    encoder text;
}

neighbor 10.100.25.7 {
    router-id 172.31.252.2;
    local-address 172.31.252.2;
    local-as 65500;
    peer-as 65500;
    hold-time 180;

    family {
        ipv4 unicast;
    }

    api {
        processes [ watchdog ];
    }
}

neighbor 10.255.255.208 {
    router-id 172.31.252.2;
    local-address 172.31.252.2;
    local-as 65500;
    peer-as 65500;
    hold-time 180;

    family {
        ipv4 unicast;
        ipv4 flow;
    }

    api {
        processes [ watchdog ];
    }
}
